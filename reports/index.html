<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SD — QA Reports</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b0d0c;
      color: #f1f4ee;
      font-family: system-ui, sans-serif;
    }

    main {
      width: min(900px, 90%);
    }

    h1 {
      font-size: clamp(3rem, 8vw, 6rem);
      margin-bottom: 1rem;
    }

    p {
      color: #929b92;
    }

    .reports {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1rem;
      margin-top: 3rem;
    }

    a {
      padding: 2rem;
      border: 1px solid #2a302a;
      background: #121513;
      color: inherit;
      text-decoration: none;
      transition: 0.25s;
    }

    a:hover {
      transform: translateY(-6px);
      border-color: #c9ff3d;
    }

    span {
      color: #c9ff3d;
    }
  </style>
</head>

<body>
  <main>
    <span>SD — QA REPORTS</span>
    <h1>Observatoire qualité</h1>
    <p>Cartographie et couverture automatisée de SauceDemo.</p>

    <section class="reports">
      <a href="./coverage/">
        <h2>Couverture fonctionnelle</h2>
        <p>Fonctionnalités, règles métier et écarts de couverture.</p>
      </a>

      <a href="./acceptance/">
        <h2>Acceptance Coverage</h2>
        <p>User Stories, critères d’acceptation et types de cas.</p>
      </a>
    </section>
  </main>
</body>
</html>
