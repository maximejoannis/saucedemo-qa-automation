name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Playwright tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Le script quality:report doit générer le dossier quality-report/
      - name: Generate code quality report
        id: quality
        continue-on-error: true
        run: npm run quality:report

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npm test

      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: npm run allure:generate

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Allure raw results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30

      - name: Upload Allure HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      - name: Upload code quality report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: code-quality-report
          path: quality-report/
          retention-days: 30

      # Allure reste à la racine du site.
      # Le rapport ESLint/Prettier est ajouté dans /quality/.
      - name: Prepare GitHub Pages site
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        run: |
          rm -rf pages-site
          mkdir -p pages-site/quality

          cp -r allure-report/. pages-site/
          cp -r quality-report/. pages-site/quality/

      - name: Configure GitHub Pages
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        uses: actions/configure-pages@v5

      - name: Upload reports for GitHub Pages
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-site/

      # Le rapport est généré et publié avant de faire échouer le job.
      - name: Fail when code quality checks fail
        if: ${{ !cancelled() && steps.quality.outcome == 'failure' }}
        run: |
          echo "ESLint ou Prettier a détecté un problème."
          exit 1

  deploy:
    name: Publish reports
    if: ${{ always() && github.event_name != 'pull_request' && needs.test.result != 'cancelled' }}
    needs: test
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy reports to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
