name: Playwright Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Playwright tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------
      # INSTALLATION
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ------------------------------------------------------
      # QUALITÉ DU CODE
      # ------------------------------------------------------

      # continue-on-error permet de générer et publier les rapports
      # avant de faire échouer le job à la fin.
      - name: Run ESLint
        id: eslint
        continue-on-error: true
        run: npm run lint

      - name: Check Prettier formatting
        id: prettier
        continue-on-error: true
        run: npm run format:check

      - name: Generate code quality report
        if: ${{ !cancelled() }}
        run: npm run quality:report

      - name: Display code quality status
        if: ${{ !cancelled() }}
        run: |
          echo "ESLint outcome: ${{ steps.eslint.outcome }}"
          echo "Prettier outcome: ${{ steps.prettier.outcome }}"

      # ------------------------------------------------------
      # PLAYWRIGHT
      # ------------------------------------------------------

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npm test

      # ------------------------------------------------------
      # ALLURE
      # ------------------------------------------------------

      # La commande existante est conservée afin de ne pas modifier
      # ta génération Allure ni son historique.
      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: npm run allure:generate

      # ------------------------------------------------------
      # ARTEFACTS GITHUB ACTIONS
      # ------------------------------------------------------

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Allure raw results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Allure HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload code quality report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: code-quality-report
          path: quality-report/
          retention-days: 30
          if-no-files-found: error

      # ------------------------------------------------------
      # GITHUB PAGES
      # ------------------------------------------------------

      - name: Prepare GitHub Pages site
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        run: |
          rm -rf pages-site
          mkdir -p pages-site/quality
          cp -r allure-report/. pages-site/
          cp -r quality-report/. pages-site/quality/

      - name: Configure GitHub Pages
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        uses: actions/configure-pages@v5

      - name: Upload reports for GitHub Pages
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-site/

      # ------------------------------------------------------
      # QUALITY GATE
      # Cette étape doit rester après les uploads.
      # ------------------------------------------------------

      - name: Fail when code quality checks fail
        if: >-
          ${{
            !cancelled() &&
            (
              steps.eslint.outcome == 'failure' ||
              steps.prettier.outcome == 'failure'
            )
          }}
        run: |
          echo "::error::Le contrôle qualité du code a échoué."

          if [ "${{ steps.eslint.outcome }}" = "failure" ]; then
            echo "::error::ESLint a échoué. Consultez l'étape 'Run ESLint'."
          fi

          if [ "${{ steps.prettier.outcome }}" = "failure" ]; then
            echo "::error::Prettier a échoué. Consultez l'étape 'Check Prettier formatting'."
          fi

          exit 1

  deploy:
    name: Publish reports

    if: >-
      ${{
        always() &&
        github.event_name != 'pull_request' &&
        needs.test.result != 'cancelled'
      }}

    needs: test
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy reports to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
