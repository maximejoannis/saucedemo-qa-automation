name: Playwright Tests and Reports

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

# Empêche deux publications GitHub Pages simultanées.
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  test:
    name: Tests and report generation
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      # ======================================================
      # INSTALLATION
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ======================================================
      # QUALITÉ DU CODE
      # ======================================================

      # Les contrôles peuvent échouer sans interrompre immédiatement
      # le workflow afin que les rapports soient quand même générés.
      - name: Run ESLint
        id: eslint
        continue-on-error: true
        run: npm run lint

      - name: Check Prettier formatting
        id: prettier
        continue-on-error: true
        run: npm run format:check

      - name: Generate code quality report
        if: ${{ !cancelled() }}
        run: npm run quality:report

      - name: Display code quality status
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          echo "ESLint outcome: ${{ steps.eslint.outcome }}"
          echo "Prettier outcome: ${{ steps.prettier.outcome }}"

      # ======================================================
      # PLAYWRIGHT
      # ======================================================

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npm test

      # ======================================================
      # ALLURE
      # ======================================================

      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: npm run allure:generate

      # ======================================================
      # VALIDATION DES RAPPORTS STATIQUES
      # ======================================================

      - name: Validate static reports
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          test -f reports/index.html
          test -f reports/coverage/index.html
          test -f reports/acceptance/index.html

          echo "Static HTML reports are present."

          find reports \
            -type f \
            -name "*.js" \
            -print0 |
            xargs -0 -r -n1 node --check

          echo "JavaScript syntax validation completed."

      # ======================================================
      # ARTEFACTS GITHUB ACTIONS
      # ======================================================

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Allure raw results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Allure HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload code quality report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: code-quality-report
          path: quality-report/
          retention-days: 30
          if-no-files-found: error

      - name: Upload functional reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: functional-reports
          path: reports/
          retention-days: 30
          if-no-files-found: error

      # ======================================================
      # CONSTRUCTION DU SITE GITHUB PAGES
      # ======================================================

      - name: Prepare GitHub Pages site
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        shell: bash
        run: |
          rm -rf pages-site

          mkdir -p pages-site/allure
          mkdir -p pages-site/quality
          mkdir -p pages-site/coverage
          mkdir -p pages-site/acceptance

          # Page d'accueil des rapports
          cp reports/index.html pages-site/index.html

          # Rapport de couverture fonctionnelle
          cp -r reports/coverage/. pages-site/coverage/

          # Rapport des user stories et critères d'acceptation
          cp -r reports/acceptance/. pages-site/acceptance/

          # Rapport d'exécution Allure
          cp -r allure-report/. pages-site/allure/

          # Rapport de qualité ESLint et Prettier
          cp -r quality-report/. pages-site/quality/

          # Désactive le traitement Jekyll.
          touch pages-site/.nojekyll

          echo "GitHub Pages content:"
          find pages-site -maxdepth 2 -type f | sort

      - name: Configure GitHub Pages
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-site/

      # ======================================================
      # QUALITY GATE
      # Cette étape reste après la génération et les uploads.
      # ======================================================

      - name: Fail when code quality checks fail
        if: >-
          ${{
            !cancelled() &&
            (
              steps.eslint.outcome == 'failure' ||
              steps.prettier.outcome == 'failure'
            )
          }}
        shell: bash
        run: |
          echo "::error::Le contrôle qualité du code a échoué."

          if [ "${{ steps.eslint.outcome }}" = "failure" ]; then
            echo "::error::ESLint a échoué. Consultez l'étape 'Run ESLint'."
          fi

          if [ "${{ steps.prettier.outcome }}" = "failure" ]; then
            echo "::error::Prettier a échoué. Consultez l'étape 'Check Prettier formatting'."
          fi

          exit 1

  # ==========================================================
  # DÉPLOIEMENT UNIQUE VERS GITHUB PAGES
  # ==========================================================

  deploy:
    name: Publish reports to GitHub Pages

    if: >-
      ${{
        always() &&
        github.event_name != 'pull_request' &&
        needs.test.result != 'cancelled'
      }}

    needs: test
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy reports to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
