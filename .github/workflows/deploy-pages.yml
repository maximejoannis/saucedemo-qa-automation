name: Deploy QA reports to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'reports/**'
      - '.github/workflows/deploy-pages.yml'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validate reports
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify required files
        run: |
          test -f reports/index.html
          test -f reports/coverage/index.html
          test -f reports/acceptance/index.html

      - name: Verify JavaScript syntax
        run: |
          find reports -name "*.js" -print0 |
          xargs -0 -r -n1 node --check

  deploy:
    name: Deploy GitHub Pages
    needs: validate
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Disable Jekyll processing
        run: touch reports/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: reports

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
